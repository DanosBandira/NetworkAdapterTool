include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - windows/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - prefer_final_locals
    - prefer_final_fields
    - avoid_dynamic_calls
    - unawaited_futures
